# dsh-mattpocock-skills bundle layer: mount the packaged Matt Pocock skill
# provider into the HOST skill registry, so every agent preset's scope chain
# merges the skills it publishes.
#
# This patch is applied over the dsh-base layer. Later layers (the profile's
# own cordis.patch.yml and --patch overlays) can still address this row by id.
- insert:
    - id: dsh-mattpocock-skills
      name: 'dsh-mattpocock-skills'
